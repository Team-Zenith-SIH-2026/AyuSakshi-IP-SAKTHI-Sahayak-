# Without this, Compose derives the project name from the directory name. This
# checkout sits in a folder containing "--_", which produces adjacent separators
# in the generated image reference and Docker rejects it outright:
#   invalid reference format
# Pinning the project name makes the stack start regardless of the folder it is
# cloned into, which matters on a demo machine nobody wants to debug.
name: ayusakshi

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ayusakshi_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ayusakshi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ayusakshi_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-ayusakshi_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ayusakshi_user} -d ${POSTGRES_DB:-ayusakshi_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ayusakshi_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ayusakshi_ai_service
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ayusakshi_user}:${POSTGRES_PASSWORD:-ayusakshi_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-ayusakshi_db}
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_SECRET=${AI_SERVICE_SECRET:-ayusakshi_internal_ai_token_2026}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
      # These were absent, so editing them in .env silently had no effect inside
      # the container and the config.py defaults were what actually ran. The
      # embedding model in particular must be identical at seed time and query
      # time or every stored vector is compared against a different space.
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      - RERANKER_MODEL=${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      - SIMILARITY_THRESHOLD=${SIMILARITY_THRESHOLD:-0.30}
      - CONFIDENCE_ABSTAIN_THRESHOLD=${CONFIDENCE_ABSTAIN_THRESHOLD:-0.50}
      - BHASHINI_USER_ID=${BHASHINI_USER_ID}
      - BHASHINI_API_KEY=${BHASHINI_API_KEY}
      - BHASHINI_PIPELINE_ID=${BHASHINI_PIPELINE_ID}
      - BHASHINI_ENABLED=${BHASHINI_ENABLED:-false}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./knowledge-base:/app/knowledge-base
      - ./ai-service/app:/app/app
      # The backend writes uploads here and passes the path to this service.
      # Without this mount that path does not exist in this container and every
      # ingestion job fails with "File not found".
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ayusakshi_backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ayusakshi_user}:${POSTGRES_PASSWORD:-ayusakshi_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-ayusakshi_db}
      - REDIS_URL=redis://redis:6379
      # BullMQ reads REDIS_HOST/REDIS_PORT directly, not REDIS_URL. Without these
      # it defaults to 127.0.0.1 inside the container and every job silently fails.
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-ayusakshi_jwt_super_secret_key_sih26045_prod_ready}
      - AI_SERVICE_URL=http://ai-service:8000
      - AI_SERVICE_SECRET=${AI_SERVICE_SECRET:-ayusakshi_internal_ai_token_2026}
      - CLIENT_URL=http://localhost:5173
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ayusakshi_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
